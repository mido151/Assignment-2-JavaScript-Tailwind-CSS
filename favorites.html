<!doctype html>
<html lang="en" data-theme="saver" class="scheme-light performance:scheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorites · Student Laptop Finder</title>
  <meta name="description" content="Your saved laptops with total and average price.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="dist/output.css">
  <script src="src/js/theme-boot.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-page font-sans text-ink antialiased transition-colors duration-300">
  <a href="#main" class="btn-action sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50">Skip to content</a>

  <header class="sticky top-0 z-40 border-b border-line bg-page/90 backdrop-blur">
    <div class="relative mx-auto flex h-16 max-w-6xl items-center gap-2 px-4 sm:gap-3 sm:px-6">
      <a href="index.html" class="mr-auto flex items-center gap-2 rounded-md text-lg font-bold tracking-tight focus-visible:outline-3 focus-visible:outline-accent-text">
        <span class="grid size-9 place-items-center rounded-lg bg-accent text-accent-ink">
          <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path stroke-linecap="round" d="M2 19h20"/></svg>
        </span>
        <span>Laptop<span class="text-accent-text">Finder</span></span>
      </a>

      <nav id="site-nav" aria-label="Main" class="absolute inset-x-0 top-full hidden flex-col gap-1 border-b border-line bg-page p-4 md:static md:flex md:flex-row md:border-0 md:bg-transparent md:p-0">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="laptops.html">Laptops</a>
        <a class="nav-link" href="favorites.html" aria-current="page">Favorites <span data-fav-count class="ml-1 rounded-full bg-heart px-1.5 py-0.5 font-mono text-xs text-page">0</span></a>
        <a class="nav-link" href="compare.html">Compare</a>
      </nav>

      <button id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Performance Mode"
        class="group inline-flex items-center gap-2 rounded-full border-2 border-line bg-surface p-1 text-sm font-bold transition duration-200 hover:border-ink focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-accent-text lg:pr-3">
        <span class="relative h-7 w-12 rounded-full bg-raised">
          <span class="absolute top-1 left-1 grid size-5 place-items-center rounded-full bg-accent-text text-page transition-transform duration-300 group-aria-checked:translate-x-5 motion-reduce:transition-none">
            <svg viewBox="0 0 24 24" class="size-3.5 fill-current group-aria-checked:hidden" aria-hidden="true"><path d="M17 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1Zm-3 15h-4v-2h4Zm0-4h-4v-2h4Z"/></svg>
            <svg viewBox="0 0 24 24" class="hidden size-3.5 fill-current group-aria-checked:block" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg>
          </span>
        </span>
        <span id="theme-label" class="hidden whitespace-nowrap lg:inline">Battery Saver</span>
      </button>

      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"
        class="grid size-10 place-items-center rounded-full border-2 border-line bg-surface transition hover:border-ink focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-accent-text md:hidden">
        <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" aria-hidden="true"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-10 sm:px-6">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="text-xs font-bold tracking-widest text-heart uppercase">Saved on this device</p>
        <h1 class="mt-1 text-4xl font-bold tracking-tight sm:text-5xl">Your favorites</h1>
      </div>
      <div class="flex flex-wrap gap-3">
        <a href="compare.html" class="btn-action">Compare favorites</a>
        <button id="clear-favorites" type="button" class="btn-ghost hover:border-heart hover:text-heart">Clear all</button>
      </div>
    </div>

    <dl class="mt-8 grid gap-3 sm:grid-cols-3">
      <div class="rounded-2xl border border-line bg-surface p-5">
        <dt class="text-sm font-semibold text-muted">Saved laptops</dt>
        <dd id="favorites-count" class="mt-1 font-mono text-3xl font-bold">0</dd>
      </div>
      <div class="rounded-2xl border border-line bg-surface p-5">
        <dt class="text-sm font-semibold text-muted">Total price</dt>
        <dd id="favorites-total" class="mt-1 font-mono text-3xl font-bold">0 EGP</dd>
      </div>
      <div class="rounded-2xl bg-accent p-5 text-accent-ink">
        <dt class="text-sm font-semibold">Average price</dt>
        <dd id="favorites-average" class="mt-1 font-mono text-3xl font-bold">0 EGP</dd>
      </div>
    </dl>

    <div id="favorites-grid" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>


  <footer class="mt-16 border-t border-line">
    <div class="mx-auto flex max-w-6xl flex-col gap-2 px-4 py-8 text-sm text-muted sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <p><span class="font-bold text-ink">Laptop<span class="text-accent-text">Finder</span></span> · SW302 Assignment 2 · Mido Sherif</p>
      <p>Prices are approximate, in Egyptian pounds (EGP).</p>
    </div>
  </footer>

  <script type="module" src="src/js/favorites.js"></script>
</body>
</html>
